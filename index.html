<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" type="image/png" href="./images.png">
  <title>ORG OS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d19;
      --panel: #111a2b;
      --line: #26344b;
      --muted: #9aa9c0;
      --text: #f4f7ff;
      --blue: #79a7ff;
      --purple: #b39aff;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 0%, #1b3261 0, transparent 43%),
        radial-gradient(ellipse at 100% 20%, #35215c 0, transparent 35%),
        var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(28px, 7vw, 56px);
      text-align: center;
      background: color-mix(in srgb, var(--panel) 90%, transparent);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 80px #0006;
    }

    .logo {
      display: grid;
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      place-items: center;
      overflow: hidden;
      background: #fff;
      border-radius: 18px;
    }

    .logo img { width: 100%; height: 100%; object-fit: contain; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.25rem); letter-spacing: -0.04em; }
    p { margin: 14px 0 28px; color: var(--muted); line-height: 1.7; }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      color: #08101f;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .button:hover { filter: brightness(1.08); transform: translateY(-2px); }
    .button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

    footer { margin-top: 30px; color: var(--muted); font-size: 0.9rem; }
    footer a { color: var(--blue); }
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="./images.png" alt="ORG OS logo"></div>
    <h1>Welcome to ORG OS</h1>
    <p>Find setup instructions, guides, and more in the ORG OS documentation.</p>
    <a class="button" href="https://docs.google.com/document/d/1xER1nLe8qbM0OJMBdmzO7BzppauIUi7okF37WQ-Y78Y/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Open ORG OS Docs</a>
    <footer>ORG OS · <a href="https://docs.google.com/document/d/1xER1nLe8qbM0OJMBdmzO7BzppauIUi7okF37WQ-Y78Y/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Return to ORG OS</a></footer>
  </main>
</body>
</html>
